<div class="collapse show two-factor-collapse">
    <form method="post" data-request="onTwoFactorChallenge" data-request-flash>
        <input type="hidden" name="redirect" value="account/index" />

        <div class="text-center pb-2">
            <h1 class="h2 mb-3">{{ __("Enter the code found in your authenticator app") }}</h1>
        </div>

        <div class="form-floating my-3">
            <input
                name="code"
                type="text"
                class="form-control"
                id="inputTwoFactorCode"
                placeholder="name@example.com"
            />
            <label for="inputTwoFactorCode">{{ __("Authentication code") }}</label>
        </div>

        <button
            class="btn btn-primary btn-lg w-100 py-2"
            data-attach-loading
            type="submit">
            {{ __("Confirm") }}
        </button>
    </form>

    <div class="text-center">
        <p class="mt-5 mb-3 text-body-secondary">
            {{ __("Lost device?") }}
            <a
                href="#"
                data-bs-toggle="collapse"
                data-bs-target=".two-factor-collapse">
                {{ __("Use a recovery code") }}
            </a>
        </p>
    </div>
</div>

        <button
            class="btn btn-primary btn-lg w-100 py-2"
            data-attach-loading
            type="submit">
            {{ __("Confirm") }}
        </button>
    </form>

    <div class="text-center">
        <p class="mt-5 mb-3 text-body-secondary">
            {{ __("Found device?") }}

</div>
