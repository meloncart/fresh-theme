<form
    method="post"
    class="modal-content"
    data-request="onDeleteCustomer"
    data-request-flash>

    <input type="hidden" name="redirect" value="index" />

    <div class="modal-header">
        <h5 class="modal-title h4">
            {{ __("Delete account") }}
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
    </div>
    <div class="modal-body">
        <p>
            {{ __("Are you sure you want to permanently delete your account? Please enter your password to confirm.") }}
        </p>

        <div>
            <input
                id="deleteAccountPassword"
                name="password"
                type="password"
                value=""
                class="form-control"
                placeholder="{{ __("Password") }}"
            />
        </div>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
            {{ __("Cancel") }}
        </button>
        <button
            class="btn btn-danger"
            data-attach-loading
            type="submit">
            {{ __("Delete account") }}
        </button>
    </div>

</form>

<script>
setTimeout(function() {
    document.getElementById('deleteAccountPassword').focus();
}, 100);
</script>
